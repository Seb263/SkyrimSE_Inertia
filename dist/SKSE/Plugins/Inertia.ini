; Inertia - Mod Settings

[General]
# This parameter determines the verbosity level used by the mod for logging and communication.
# Levels of verbosity:
#    0: Only errors will be logged.
#    1: Standard information will be logged.
#    2: Advanced logging will be enabled.
iVerboseMode = 1

[Inertia]
# Duration in seconds during which the inertia will be maintained.
fDuration = 5.0

# Determine if the inertia algorithm should also apply when a dead actor receives a hit.
bApplyOnHit = 0
